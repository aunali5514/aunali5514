<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200" width="700" height="200">
<defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="0" y="0" width="700" height="200" fill="#0D1117"/>
  <rect x="20" y="20" width="660" height="160" rx="14" fill="#161B22" opacity="0.35" stroke="#00F5FF" stroke-width="1" filter="url(#glow)"/>
  <text x="350.0" y="92.0" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-style="italic" fill="#FFFFFF" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0.0000;0.0300;0.2200;0.2500;1" dur="20.0s" repeatCount="indefinite"/>
    &#8220;The best way to predict the future is to invent it.&#8221;
  </text>
  <text x="350.0" y="122.0" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12" fill="#00F5FF" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0.0000;0.0300;0.2200;0.2500;1" dur="20.0s" repeatCount="indefinite"/>
    — Alan Kay
  </text>
  <text x="350.0" y="92.0" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-style="italic" fill="#FFFFFF" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0.2500;0.2800;0.4700;0.5000;1" dur="20.0s" repeatCount="indefinite"/>
    &#8220;Premature optimization is the root of all evil.&#8221;
  </text>
  <text x="350.0" y="122.0" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12" fill="#00F5FF" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0.2500;0.2800;0.4700;0.5000;1" dur="20.0s" repeatCount="indefinite"/>
    — Donald Knuth
  </text>
  <text x="350.0" y="92.0" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-style="italic" fill="#FFFFFF" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0.5000;0.5300;0.7200;0.7500;1" dur="20.0s" repeatCount="indefinite"/>
    &#8220;Simplicity is a prerequisite for reliability.&#8221;
  </text>
  <text x="350.0" y="122.0" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12" fill="#00F5FF" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0.5000;0.5300;0.7200;0.7500;1" dur="20.0s" repeatCount="indefinite"/>
    — Edsger Dijkstra
  </text>
  <text x="350.0" y="92.0" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-style="italic" fill="#FFFFFF" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0.7500;0.7800;0.9700;1.0000;1" dur="20.0s" repeatCount="indefinite"/>
    &#8220;Somewhere, something incredible is waiting to be known.&#8221;
  </text>
  <text x="350.0" y="122.0" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12" fill="#00F5FF" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0.7500;0.7800;0.9700;1.0000;1" dur="20.0s" repeatCount="indefinite"/>
    — Carl Sagan
  </text>
</svg>