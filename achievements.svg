    <animate attributeName="y2" from="30" to="450" dur="2.5s" begin="0.3s" fill="freeze"/>
  </line>
  <circle cx="60" cy="55" r="7" fill="#0D1117" stroke="#00F5FF" stroke-width="2" filter="url(#glow)" opacity="0">
    <animate attributeName="opacity" begin="0.50s" dur="0.3s" from="0" to="1" fill="freeze"/>
  </circle>
