    <animate attributeName="opacity" begin="0.50s" dur="0.3s" from="0" to="1" fill="freeze"/>
    2024
  </text>
  <text x="84" y="89" font-family="Consolas, Menlo, monospace" font-size="13" fill="#6EE7FF" opacity="0">
