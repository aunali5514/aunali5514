<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460" width="700" height="460">
<defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="0" y="0" width="700" height="460" fill="#0D1117"/>
  <rect x="0" y="0" width="1" height="1" opacity="0">
    <animate id="loopClock" attributeName="opacity" from="0" to="0" dur="11.0s" repeatCount="indefinite"/>
  </rect>
  <rect x="15" y="15" width="330" height="130" rx="8" fill="#161B22" opacity="0.4" stroke="#00F5FF" stroke-width="1" filter="url(#glow)">
    <animate attributeName="opacity" attributeType="CSS" values="0.15;0.15;0.7;0.15;0.15" keyTimes="0;0.000;0.100;0.182;1" dur="11.0s" repeatCount="indefinite"/>
  </rect>
  <text x="31" y="43" font-family="Consolas, Menlo, monospace" font-size="14" font-weight="700" fill="#6EE7FF" letter-spacing="1">PROGRAMMING</text>
  <text x="31" y="67" font-family="Consolas, Menlo, monospace" font-size="12" fill="#FFFFFF">&gt; Python</text>
  <text x="31" y="87" font-family="Consolas, Menlo, monospace" font-size="12" fill="#FFFFFF">&gt; C#</text>
  <text x="31" y="107" font-family="Consolas, Menlo, monospace" font-size="12" fill="#FFFFFF">&gt; C++</text>
  <text x="31" y="127" font-family="Consolas, Menlo, monospace" font-size="12" fill="#FFFFFF">&gt; JavaScript</text>
  <rect x="365" y="15" width="330" height="130" rx="8" fill="#161B22" opacity="0.4" stroke="#00F5FF" stroke-width="1" filter="url(#glow)">
    <animate attributeName="opacity" attributeType="CSS" values="0.15;0.15;0.7;0.15;0.15" keyTimes="0;0.200;0.300;0.382;1" dur="11.0s" repeatCount="indefinite"/>
  </rect>
  <text x="381" y="43" font-family="Consolas, Menlo, monospace" font-size="14" font-weight="700" fill="#6EE7FF" letter-spacing="1">BACKEND</text>
  <text x="381" y="67" font-family="Consolas, Menlo, monospace" font-size="12" fill="#FFFFFF">&gt; ASP.NET Core</text>
  <text x="381" y="87" font-family="Consolas, Menlo, monospace" font-size="12" fill="#FFFFFF">&gt; RESTful APIs</text>
  <text x="381" y="107" font-family="Consolas, Menlo, monospace" font-size="12" fill="#FFFFFF">&gt; OOP</text>
  <text x="381" y="127" font-family="Consolas, Menlo, monospace" font-size="12" fill="#FFFFFF">&gt; 4-Layer Architecture</text>
  <rect x="15" y="165" width="330" height="130" rx="8" fill="#161B22" opacity="0.4" stroke="#00F5FF" stroke-width="1" filter="url(#glow)">
    <animate attributeName="opacity" attributeType="CSS" values="0.15;0.15;0.7;0.15;0.15" keyTimes="0;0.400;0.500;0.582;1" dur="11.0s" repeatCount="indefinite"/>
  </rect>
  <text x="31" y="193" font-family="Consolas, Menlo, monospace" font-size="14" font-weight="700" fill="#6EE7FF" letter-spacing="1">CLOUD</text>
  <text x="31" y="217" font-family="Consolas, Menlo, monospace" font-size="12" fill="#FFFFFF">&gt; Azure App Service</text>
  <text x="31" y="237" font-family="Consolas, Menlo, monospace" font-size="12" fill="#FFFFFF">&gt; Azure SQL Database</text>
  <text x="31" y="257" font-family="Consolas, Menlo, monospace" font-size="12" fill="#FFFFFF">&gt; GitHub Actions CI/CD</text>
  <rect x="365" y="165" width="330" height="130" rx="8" fill="#161B22" opacity="0.4" stroke="#00F5FF" stroke-width="1" filter="url(#glow)">
    <animate attributeName="opacity" attributeType="CSS" values="0.15;0.15;0.7;0.15;0.15" keyTimes="0;0.600;0.700;0.782;1" dur="11.0s" repeatCount="indefinite"/>
  </rect>
  <text x="381" y="193" font-family="Consolas, Menlo, monospace" font-size="14" font-weight="700" fill="#6EE7FF" letter-spacing="1">DATA SCIENCE</text>
  <text x="381" y="217" font-family="Consolas, Menlo, monospace" font-size="12" fill="#FFFFFF">&gt; Power BI</text>
  <text x="381" y="237" font-family="Consolas, Menlo, monospace" font-size="12" fill="#FFFFFF">&gt; Data Visualization</text>
  <text x="381" y="257" font-family="Consolas, Menlo, monospace" font-size="12" fill="#FFFFFF">&gt; Predictive Analytics</text>
  <text x="381" y="277" font-family="Consolas, Menlo, monospace" font-size="12" fill="#FFFFFF">&gt; Pandas / NumPy</text>
  <rect x="15" y="315" width="330" height="130" rx="8" fill="#161B22" opacity="0.4" stroke="#00F5FF" stroke-width="1" filter="url(#glow)">
    <animate attributeName="opacity" attributeType="CSS" values="0.15;0.15;0.7;0.15;0.15" keyTimes="0;0.800;0.900;0.982;1" dur="11.0s" repeatCount="indefinite"/>
  </rect>
  <text x="31" y="343" font-family="Consolas, Menlo, monospace" font-size="14" font-weight="700" fill="#6EE7FF" letter-spacing="1">TOOLS</text>
  <text x="31" y="367" font-family="Consolas, Menlo, monospace" font-size="12" fill="#FFFFFF">&gt; Git</text>
  <text x="31" y="387" font-family="Consolas, Menlo, monospace" font-size="12" fill="#FFFFFF">&gt; VS Code</text>
  <text x="31" y="407" font-family="Consolas, Menlo, monospace" font-size="12" fill="#FFFFFF">&gt; SQL Server</text>
  <text x="31" y="427" font-family="Consolas, Menlo, monospace" font-size="12" fill="#FFFFFF">&gt; Stored Procedures</text>
</svg>
