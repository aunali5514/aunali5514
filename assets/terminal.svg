<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 420" width="360" height="420">
<defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="0" y="0" width="1" height="1" opacity="0">
    <animate id="loopClock" attributeName="opacity" from="0" to="0" dur="13.0s" repeatCount="indefinite"/>
  </rect>
  <rect x="0" y="0" width="360" height="420" fill="#0D1117"/>
  <rect x="8" y="8" width="344" height="404" fill="none" stroke="#00F5FF" stroke-width="1.2" filter="url(#glow)" opacity="0.5"/>
  <rect x="8" y="8" width="344" height="404" fill="none" stroke="#161B22" stroke-width="1"/>
  <text x="26" y="46" font-family="Consolas, Menlo, monospace" font-size="13" font-weight="700" fill="#00F5FF" opacity="0">
    <animate attributeName="opacity" begin="loopClock.begin+0.40s" dur="0.2s" from="0" to="1" fill="freeze"/>
    <animate attributeName="opacity" begin="loopClock.begin+11.50s" dur="0.4s" from="1" to="0" fill="freeze"/>
    aun@github:~$ whoami
  </text>
  <text x="44" y="72" font-family="Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#FFFFFF" opacity="0">
    <animate attributeName="opacity" begin="loopClock.begin+0.82s" dur="0.2s" from="0" to="1" fill="freeze"/>
    <animate attributeName="opacity" begin="loopClock.begin+11.50s" dur="0.4s" from="1" to="0" fill="freeze"/>
    Aun Ali
  </text>
  <text x="44" y="94" font-family="Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#FFFFFF" opacity="0">
    <animate attributeName="opacity" begin="loopClock.begin+1.24s" dur="0.2s" from="0" to="1" fill="freeze"/>
    <animate attributeName="opacity" begin="loopClock.begin+11.50s" dur="0.4s" from="1" to="0" fill="freeze"/>
    Data Science Student
  </text>
  <text x="44" y="116" font-family="Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#FFFFFF" opacity="0">
    <animate attributeName="opacity" begin="loopClock.begin+1.66s" dur="0.2s" from="0" to="1" fill="freeze"/>
    <animate attributeName="opacity" begin="loopClock.begin+11.50s" dur="0.4s" from="1" to="0" fill="freeze"/>
    Developer | AI Enthusiast | Azure Explorer
  </text>
  <text x="26" y="138" font-family="Consolas, Menlo, monospace" font-size="13" font-weight="700" fill="#00F5FF" opacity="0">
    <animate attributeName="opacity" begin="loopClock.begin+2.08s" dur="0.2s" from="0" to="1" fill="freeze"/>
    <animate attributeName="opacity" begin="loopClock.begin+11.50s" dur="0.4s" from="1" to="0" fill="freeze"/>
    aun@github:~$ cat skills.txt
  </text>
  <text x="44" y="164" font-family="Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#FFFFFF" opacity="0">
    <animate attributeName="opacity" begin="loopClock.begin+2.50s" dur="0.2s" from="0" to="1" fill="freeze"/>
    <animate attributeName="opacity" begin="loopClock.begin+11.50s" dur="0.4s" from="1" to="0" fill="freeze"/>
    Python . C# . SQL . ASP.NET Core
  </text>
  <text x="44" y="186" font-family="Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#FFFFFF" opacity="0">
    <animate attributeName="opacity" begin="loopClock.begin+2.92s" dur="0.2s" from="0" to="1" fill="freeze"/>
    <animate attributeName="opacity" begin="loopClock.begin+11.50s" dur="0.4s" from="1" to="0" fill="freeze"/>
    SQL Server . Power BI . Pandas . NumPy
  </text>
  <text x="44" y="208" font-family="Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#FFFFFF" opacity="0">
    <animate attributeName="opacity" begin="loopClock.begin+3.34s" dur="0.2s" from="0" to="1" fill="freeze"/>
    <animate attributeName="opacity" begin="loopClock.begin+11.50s" dur="0.4s" from="1" to="0" fill="freeze"/>
    Machine Learning . Git . Azure
  </text>
  <text x="26" y="230" font-family="Consolas, Menlo, monospace" font-size="13" font-weight="700" fill="#00F5FF" opacity="0">
    <animate attributeName="opacity" begin="loopClock.begin+3.76s" dur="0.2s" from="0" to="1" fill="freeze"/>
    <animate attributeName="opacity" begin="loopClock.begin+11.50s" dur="0.4s" from="1" to="0" fill="freeze"/>
    aun@github:~$ cat current_status.txt
  </text>
  <text x="44" y="256" font-family="Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#FFFFFF" opacity="0">
    <animate attributeName="opacity" begin="loopClock.begin+4.18s" dur="0.2s" from="0" to="1" fill="freeze"/>
    <animate attributeName="opacity" begin="loopClock.begin+11.50s" dur="0.4s" from="1" to="0" fill="freeze"/>
    Currently Building: CogniCareer
  </text>
  <text x="44" y="278" font-family="Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#FFFFFF" opacity="0">
    <animate attributeName="opacity" begin="loopClock.begin+4.60s" dur="0.2s" from="0" to="1" fill="freeze"/>
    <animate attributeName="opacity" begin="loopClock.begin+11.50s" dur="0.4s" from="1" to="0" fill="freeze"/>
    Learning: Azure . AI . Open Source
  </text>
  <text x="26" y="300" font-family="Consolas, Menlo, monospace" font-size="13" font-weight="700" fill="#00F5FF" opacity="0">
    <animate attributeName="opacity" begin="loopClock.begin+5.02s" dur="0.2s" from="0" to="1" fill="freeze"/>
    <animate attributeName="opacity" begin="loopClock.begin+11.50s" dur="0.4s" from="1" to="0" fill="freeze"/>
    aun@github:~$ echo $MOTTO
  </text>
  <text x="26" y="326" font-family="Consolas, Menlo, monospace" font-size="13" font-weight="700" fill="#00FF88" opacity="0">
    <animate attributeName="opacity" begin="loopClock.begin+5.44s" dur="0.2s" from="0" to="1" fill="freeze"/>
    <animate attributeName="opacity" begin="loopClock.begin+11.50s" dur="0.4s" from="1" to="0" fill="freeze"/>
    Learn. Build. Improve. Repeat.
  </text>
  <g visibility="hidden">
    <animate attributeName="visibility" begin="loopClock.begin+6.06s" dur="0.01s" to="visible" fill="freeze"/>
    <animate attributeName="visibility" begin="loopClock.begin+11.50s" dur="0.01s" to="hidden" fill="freeze"/>
    <rect x="26" y="336" width="9" height="14" fill="#00F5FF">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
