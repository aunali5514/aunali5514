<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 220" width="700" height="220">
<defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="0" y="0" width="700" height="220" fill="#0D1117"/>
  <line x1="30" y1="30" x2="670" y2="30" stroke="#161B22" stroke-width="1"/>
  <text x="350.0" y="70" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="17" font-weight="700" fill="#00FF88" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.05;0.075;0.8125;0.8625;1" dur="8.0s" repeatCount="indefinite"/>
    SESSION END
  </text>
  <text x="350.0" y="102" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#FFFFFF" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1625;0.1875;0.8125;0.8625;1" dur="8.0s" repeatCount="indefinite"/>
    Thanks for visiting.
  </text>
  <text x="350.0" y="134" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#FFFFFF" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.275;0.3;0.8125;0.8625;1" dur="8.0s" repeatCount="indefinite"/>
    See you again.
  </text>
  <text x="350.0" y="166" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#FFFFFF" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3875;0.4125;0.8125;0.8625;1" dur="8.0s" repeatCount="indefinite"/>
    Logging Out...
  </text>
  <rect x="344.0" y="184" width="10" height="16" fill="#00F5FF" opacity="0">
    <animate attributeName="opacity" values="0;0;1;0;1;0;1;0;0" keyTimes="0.0;0.525;0.525;0.5875;0.65;0.7125;0.775;0.8125;1.0" dur="8.0s" repeatCount="indefinite"/>
  </rect>
  <line x1="30" y1="190" x2="670" y2="190" stroke="#161B22" stroke-width="1"/>
</svg>
